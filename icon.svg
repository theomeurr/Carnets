<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1" />
      <stop offset="0.55" stop-color="#a855f7" />
      <stop offset="1" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#fond)" />

  <!--
    Un folio : le feuillet. Le coin replié en haut à droite est la signature
    du nom ; les onglets colorés sur la tranche gauche reprennent ceux que
    l'interface affiche à côté de chaque bloc-notes.
  -->
  <rect x="96" y="164" width="52" height="52" rx="18" fill="#fbbf24" />
  <rect x="96" y="230" width="52" height="52" rx="18" fill="#34d399" />
  <rect x="96" y="296" width="52" height="52" rx="18" fill="#38bdf8" />

  <!-- Le feuillet, coin supérieur droit coupé -->
  <path
    d="M152 116h146l86 86v172a26 26 0 0 1-26 26H152a26 26 0 0 1-26-26V142a26 26 0 0 1 26-26z"
    fill="#ffffff"
  />
  <!-- Le repli, qui laisse voir le dos de la feuille -->
  <path d="M298 116l86 86h-70a16 16 0 0 1-16-16z" fill="#cdd0e0" />

  <!-- L'écriture -->
  <g fill="#6366f1">
    <rect x="170" y="248" width="164" height="20" rx="10" opacity="0.9" />
    <rect x="170" y="294" width="164" height="20" rx="10" opacity="0.6" />
    <rect x="170" y="340" width="102" height="20" rx="10" opacity="0.35" />
  </g>
</svg>
